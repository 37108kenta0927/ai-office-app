# ブランドごとの設定。ブランドを追加する場合はここに1エントリ追記し、
# 対応する WP_APP_PASSWORD_<ID> シークレットをGitHub Actionsに登録するだけでよい。
brands:
  - id: onexone-hair
    name: "onexone HAIR"
    siteUrl: "https://onexone-hair.com"
    wpUser: "blog-automation"
    # process.env[wpAppPasswordSecret] からApplication Passwordを読む
    wpAppPasswordSecret: "WP_APP_PASSWORD_ONEXONE_HAIR"
    categories: ["カラー・デザインカラー", "ヘアケア"]
    # 地域SEO用。記事のキーワード・タイトルに自然に織り込む。
    location:
      prefecture: "富山県"
      city: "富山市"
      region: "北陸"
    author:
      name: "スタイリスト（担当者名に変更）"
      bio: "onexone HAIR所属スタイリスト。"
    brandVoice: |
      親しみやすく、専門用語は噛み砕いて説明するトーン。語尾は「です・ます調」。
      施術効果を断定・保証する表現は使わない。
      onexone HAIRはブリーチカラー・デザインカラー（インナーカラー、グラデーションカラーなど）を
      得意とするサロン。記事全体を通して、その専門性が伝わるトーンにする。
    disclaimer: "効果には個人差があります。詳しくは店舗スタッフへご相談ください。"
    bookingUrl: "https://lin.ee/NX7srEL"
    topicsFile: "content/topics/onexone-hair.yaml"

