# Meta広告(Facebook/Instagram)アカウントの設定。
#
# adAccountId: Meta ビジネスマネージャの「広告アカウントID」("act_"を除いた数字部分)。
# campaignNameContains: 診断対象キャンペーンを名前の部分一致で絞り込む。
#   ワンバイワンは集客用・求人用のキャンペーンが同じ広告アカウントに同居しているため、
#   キャンペーン名に「集客」「求人」「採用」等が含まれている前提で振り分けている。
#   実際の命名規則と違う場合はここを書き換えること(そうしないと集客と求人の
#   キャンペーンが混ざって診断されてしまう)。
#   ホライズンは集客用・求人用で広告アカウント自体が分かれているため、絞り込み不要。
accounts:
  - id: acquisition-onexone
    label: "集客(ワンバイワン)"
    adAccountId: "1488390254781720"
    objective: acquisition
    campaignNameContains: ["集客"]
    goal: "新規客の来店予約・問い合わせを増やす"
    brandVoice: |
      新規顧客に「行ってみたい」と思わせる広告が狙い。
      来店予約や公式LINE相談などのコンバージョン数・コンバージョン単価を最重視する。

  - id: acquisition-horizon
    label: "集客(ホライズン)"
    adAccountId: "2065712894223989"
    objective: acquisition
    goal: "新規客の来店予約・問い合わせを増やす"
    brandVoice: |
      新規顧客に「行ってみたい」と思わせる広告が狙い。
      来店予約や公式LINE相談などのコンバージョン数・コンバージョン単価を最重視する。

  - id: recruit-onexone
    label: "求人(ワンバイワン)"
    adAccountId: "1488390254781720"
    objective: recruit
    campaignNameContains: ["求人", "採用"]
    goal: "20代でヘアカラー・デザインカラーの技術に興味があるスタイリストの応募を増やす"
    targetPersona: |
      年齢層: 20代
      興味関心: ヘアカラー・デザインカラーの技術力を伸ばしたい
    brandVoice: |
      カラー技術を磨きたい若手スタイリストに刺さる訴求(カラー技術力・研修環境・活躍事例など)を重視する。

  - id: recruit-horizon
    label: "求人(ホライズン)"
    adAccountId: "1077680905193674"
    objective: recruit
    goal: "髪質改善・縮毛矯正に関心があり、働き方の負担を抑えて長く働きたいスタイリストの応募を増やす"
    targetPersona: |
      興味関心: 髪質改善・縮毛矯正の技術
      価値観: プライベートとの両立、過度な残業やノルマを避けたい
    brandVoice: |
      技術の専門性(髪質改善・縮毛矯正)と、働きやすさ(残業の少なさ、ノルマ重視でないこと等)の
      両方を訴求する。
