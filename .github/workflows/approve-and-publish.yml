name: Blog - Approve and Publish

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: >
      contains(github.event.issue.labels.*.name, 'blog-review') &&
      (contains(github.event.comment.body, 'おけ') || contains(github.event.comment.body, '/publish'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: blog-automation
        run: npm ci

      - name: Publish approved post
        working-directory: blog-automation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 追加ブランド分は同様に1行ずつ追記する
          WP_APP_PASSWORD_ONEXONE_HAIR: ${{ secrets.WP_APP_PASSWORD_ONEXONE_HAIR }}
          WP_APP_PASSWORD_HORIZON_HAIR: ${{ secrets.WP_APP_PASSWORD_HORIZON_HAIR }}
        run: npx tsx scripts/approve-publish.ts --issue ${{ github.event.issue.number }}

      - name: Commit topic status update
        run: |
          git config user.name "blog-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog-automation/content/topics/
          git diff --cached --quiet && exit 0
          git commit -m "chore(blog): mark topic published (issue #${{ github.event.issue.number }})"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((RANDOM % 5 + 1))
          done
          git push
