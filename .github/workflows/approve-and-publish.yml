name: Blog - Daily Queue Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: blog-publication-queue
  cancel-in-progress: false

jobs:
  daily-queue:
    # Require exact command, exact fixed operations issue, and exact owner login.
    if: >
      github.event.issue.pull_request == null &&
      github.event.issue.number == 58 &&
      github.event.sender.login == '37108kenta0927' &&
      (github.event.comment.body == '/blog-daily-dry-run' || github.event.comment.body == '/blog-daily-publish')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: blog-automation
        run: npm ci
      - name: Run only the requested queue command
        working-directory: blog-automation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_BLOG }}
          WP_APP_PASSWORD_ONEXONE_HAIR: ${{ secrets.WP_APP_PASSWORD_ONEXONE_HAIR }}
          WP_APP_PASSWORD_HORIZON_HAIR: ${{ secrets.WP_APP_PASSWORD_HORIZON_HAIR }}
        run: |
          FLAGS=""
          if [ "${{ github.event.comment.body }}" = "/blog-daily-dry-run" ]; then FLAGS="--dry-run"; fi
          RESULT=0
          npx tsx scripts/review-oldest-draft.ts --brand onexone-hair $FLAGS || RESULT=1
          npx tsx scripts/review-oldest-draft.ts --brand horizon-hair $FLAGS || RESULT=1
          exit $RESULT
      - name: Commit topic status updates
        if: ${{ github.event.comment.body == '/blog-daily-publish' }}
        run: |
          git config user.name "blog-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog-automation/content/topics/
          git diff --cached --quiet && exit 0
          git commit -m "chore(blog): record daily reviewed publications"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((RANDOM % 5 + 1))
          done
          exit 1
