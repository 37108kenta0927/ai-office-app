name: Blog - Publish Oldest Reviewed Drafts

# Manual-only; the parent scheduler invokes this. Do not add a second cron.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Review only; never write WordPress, Issues, or topic status
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: blog-publication-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: blog-automation
        run: npm ci
      - name: Review both brand queues sequentially
        working-directory: blog-automation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_BLOG }}
          WP_APP_PASSWORD_ONEXONE_HAIR: ${{ secrets.WP_APP_PASSWORD_ONEXONE_HAIR }}
          WP_APP_PASSWORD_HORIZON_HAIR: ${{ secrets.WP_APP_PASSWORD_HORIZON_HAIR }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          npx tsx scripts/review-oldest-draft.ts --brand onexone-hair $FLAGS
          npx tsx scripts/review-oldest-draft.ts --brand horizon-hair $FLAGS
      - name: Commit topic status updates
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "blog-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog-automation/content/topics/
          git diff --cached --quiet && exit 0
          git commit -m "chore(blog): record daily reviewed publications"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((RANDOM % 5 + 1))
          done
          exit 1
