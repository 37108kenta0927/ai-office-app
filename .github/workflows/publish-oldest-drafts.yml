name: Blog - Publish Oldest Reviewed Drafts

# Deliberately manual-only. The parent scheduler invokes this once per JST day;
# do not add a cron here or it could create a second publishing schedule.
on:
  workflow_dispatch:
    inputs:
      brand:
        description: Brand to publish (or all for one oldest draft per brand)
        required: false
        default: all
        type: choice
        options: [all, onexone-hair, horizon-hair]
      dry_run:
        description: Review and report only; never write WordPress, Issues, or topic status
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        brand: [onexone-hair, horizon-hair]
    concurrency:
      group: daily-blog-publish-${{ matrix.brand }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: blog-automation
        run: npm ci
      - name: Review and publish the oldest safe draft
        if: ${{ inputs.brand == 'all' || inputs.brand == matrix.brand }}
        working-directory: blog-automation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_BLOG }}
          WP_APP_PASSWORD_ONEXONE_HAIR: ${{ secrets.WP_APP_PASSWORD_ONEXONE_HAIR }}
          WP_APP_PASSWORD_HORIZON_HAIR: ${{ secrets.WP_APP_PASSWORD_HORIZON_HAIR }}
        run: npx tsx scripts/review-oldest-draft.ts --brand ${{ matrix.brand }} ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit topic status update
        if: ${{ (inputs.brand == 'all' || inputs.brand == matrix.brand) && !inputs.dry_run }}
        run: |
          git config user.name "blog-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog-automation/content/topics/
          git diff --cached --quiet && exit 0
          git commit -m "chore(blog): record daily reviewed publication for ${{ matrix.brand }}"
          git push
